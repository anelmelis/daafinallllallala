// DAA Final Prep content. Lecture summaries paraphrase uploaded 2026 lecture materials.
// Sample questions are reproduced/adapted from the student's supplied sample set.
exports.lessons = [
    {
        id: 1, unit: 'Foundations', en: 'Introduction to Algorithms', ru: 'Введение в анализ алгоритмов', minutes: 9, level: 'База',
        lead: 'Алгоритм — конечная, однозначная последовательность шагов. На экзамене нужно отличать задачу, алгоритм, доказательство правильности и оценку ресурсов.',
        terms: [['Algorithm', 'Алгоритм', 'Finite sequence of precise steps that transforms input into output.'], ['Correctness', 'Правильность', 'Correct output for every valid input plus termination.'], ['Time / Space', 'Время / память', 'Resources used as the input size grows.'], ['RAM model', 'Модель вычислений', 'Treats each elementary operation and memory access as constant cost.']],
        sections: [
            { title: 'Что делает алгоритм', body: 'Любой алгоритм получает input, выполняет определённые операции и возвращает output. Пример: найти повторения в массиве. Можно сравнивать все пары за O(n²), отсортировать и проверить соседей за O(n log n) или использовать HashSet с ожидаемым O(n).' },
            { title: 'Как выбирать стратегию', body: 'Если задачи независимы, подходит Divide and Conquer. Если маленькие задачи повторяются, подумай о Dynamic Programming. Если локальный выбор можно доказать безопасным, Greedy. Если есть вершины и ребра, это граф. Если работаешь с префиксами или совпадениями строк, это строковые алгоритмы.' },
            { title: 'Корректность и эффективность', body: 'Correctness отвечает на вопрос «всегда ли результат правильный?», Efficiency — «насколько быстро?», Economy — «сколько памяти?». Для доказательства корректности полезны induction, invariants, contradiction. Тестирование само по себе не доказывает корректность.' },
            { title: 'Типы задач', body: 'Decision даёт yes/no. Search возвращает объект. Counting — количество ответов. Optimization находит лучшее значение. P означает полиномиальное решение, NP — полиномиальную проверку предоставленного решения. NP не означает «неполиномиальный».' }
        ],
        snippet: '// Один и тот же результат, разная сложность\n// for (int i=0; i<n; i++) for (int j=i+1; j<n; j++) ... // O(n²)\n// HashSet.contains(x) // expected O(1)',
        formula: 'Algorithm = Input + Well-defined Steps + Output + Termination',
        pitfalls: ['Быстрый алгоритм может быть неправильным.', 'Worst case описывает худший вход фиксированного размера, а не произвольную машину.', 'RAM model не равен измерению реальных секунд.'],
        quick: [['Что проверяет correctness?', 'Правильный ответ для всех допустимых входов и завершение.'], ['Что значит RAM model?', 'Элементарная операция считается O(1).'], ['Когда DP?', 'При перекрывающихся подзадачах и optimal substructure.'], ['Разница decision / optimization?', 'Да/нет против поиска наилучшего значения.']]
    },
    {
        id: 2, unit: 'Foundations', en: 'Divide & Conquer and Recurrences', ru: 'Рекурсия, Merge Sort и Master Theorem', minutes: 12, level: 'Формулы',
        lead: 'Divide → Conquer → Combine. Разберись, сколько рекурсивных вызовов есть, насколько уменьшается задача и сколько стоит объединение.',
        terms: [['Recursion', 'Рекурсия', 'A procedure that calls itself on a smaller input.'], ['Base case', 'Базовый случай', 'Condition that stops recursive calls.'], ['Recurrence', 'Рекуррентность', 'Runtime expressed through smaller instances.'], ['Master Theorem', 'Мастер-теорема', 'Analyzes recurrences T(n)=aT(n/b)+f(n).']],
        sections: [
            { title: 'Merge Sort: как работает', body: 'Делим массив пополам, рекурсивно сортируем левую и правую половины, затем двумя указателями сливаем их. На каждом уровне суммарная работа merge равна Θ(n). Уровней примерно log₂n. Total Θ(n log n). Глубина рекурсии Θ(log n).' },
            { title: 'Чтение рекуррентности', body: 'T(n)=aT(n/b)+f(n): a — число рекурсивных вызовов; b — во сколько раз уменьшается вход; f(n) — работа вне вызовов. Например, Merge Sort: a=2, b=2, f(n)=Θ(n).' },
            { title: 'Master Theorem', body: 'Сравни f(n) и n^(log_b a). Меньше → доминируют листья. Равно по порядку → дополнительный log. Полиномиально больше и regularity condition выполняется → доминирует f(n). В особых случаях, например разных размерах подзадач, нужен другой метод.' },
            { title: 'Другие важные виды', body: 'T(n)=T(n−1)+Θ(1) = Θ(n), потому что размер уменьшается на 1. T(n)=T(n/2)+Θ(1)=Θ(log n), потому что размер делится на 2. Karatsuba уменьшает 4 умножения половин до 3: T(n)=3T(n/2)+Θ(n)=Θ(n^1.585). Akra–Bazzi помогает анализировать неодинаковые части.' }
        ],
        snippet: 'static void sort(int[] a, int l, int r) {\n    if (l >= r) return; // base case\n    int mid = l + (r - l) / 2;\n    sort(a, l, mid);\n    sort(a, mid + 1, r);\n    merge(a, l, mid, r);\n}',
        formula: 'T(n) = aT(n/b) + f(n)   •   Merge Sort: 2T(n/2) + Θ(n) = Θ(n log n)',
        pitfalls: ['Не путай recursion depth Θ(log n) и total runtime Θ(n log n).', 'T(n−1) обычно нельзя решать Master Theorem вида T(n/b).', 'При f(n)=n²log²n оно не превращается автоматически в n²log³n.'],
        quick: [['Merge Sort runtime?', 'Θ(n log n), depth Θ(log n).'], ['Что обозначает a?', 'Количество рекурсивных вызовов.'], ['T(n)=T(n−1)+Θ(1)?', 'Θ(n).'], ['Karatsuba вместо четырёх?', 'Три рекурсивных умножения.']]
    },
    {
        id: 3, unit: 'Foundations', en: 'Asymptotic Analysis & Correctness', ru: 'Big-O, границы и инварианты', minutes: 10, level: 'База',
        lead: 'Главное: отличать верхнюю, нижнюю и точную асимптотические границы, а также объяснять корректность циклов через invariant.',
        terms: [['Big-O', 'Верхняя граница', 'Asymptotic upper bound.'], ['Omega', 'Нижняя граница', 'Asymptotic lower bound.'], ['Theta', 'Точная граница', 'Asymptotic tight bound (upper and lower).'], ['Loop invariant', 'Инвариант цикла', 'A property true before and after each iteration.']],
        sections: [
            { title: 'Big-O, Ω, Θ', body: 'O(g) ограничивает рост сверху, Ω(g) снизу, Θ(g) с обеих сторон. Например, 3n²+5n+7 = Θ(n²). При анализе выкидываем константы и младшие слагаемые. n³ не принадлежит O(n²).' },
            { title: 'Worst, average и best', body: 'Worst case — максимум среди входов данного размера. Average case — математическое ожидание относительно распределения входов. Best case — самый удачный вход. У Insertion Sort лучший случай для уже отсортированного массива Θ(n), худший — для обратного порядка Θ(n²).' },
            { title: 'Loop Invariant: три части', body: 'Initialization: invariant истинный до первой итерации. Maintenance: сохраняется при каждом шаге. Termination: invariant + условие выхода дают нужный результат. Для Selection Sort первые i позиций содержат i наименьших элементов в правильном порядке.' },
            { title: 'Empirical validation', body: 'Теория даёт предел роста, proof обосновывает correctness, measurement показывает фактическое поведение. При измерениях увеличивают n, запускают несколько раз, делают JVM warm-up и сравнивают runtime с предполагаемым графиком роста.' }
        ],
        snippet: '// Инвариант Selection Sort:\n// Перед итерацией i префикс a[0..i-1]\n// содержит i наименьших элементов в порядке.\nfor (int i = 0; i < a.length; i++) {\n    int min = i;\n    for (int j = i + 1; j < a.length; j++)\n        if (a[j] < a[min]) min = j;\n    int t = a[i]; a[i] = a[min]; a[min] = t;\n}',
        formula: 'O = upper • Ω = lower • Θ = tight • 3n² + 5n + 7 = Θ(n²)',
        pitfalls: ['Big-O — upper bound, а не автоматически точная сложность.', 'Инвариант должен быть истинным до шага, не только после поиска.', 'Amortized не равно average case.'],
        quick: [['Что такое tight bound?', 'Θ: есть и upper, и lower bound.'], ['Инвариант Selection Sort?', 'Первые i элементов — i наименьших в отсортированном порядке.'], ['Worst-case Insertion Sort?', 'Θ(n²) на обратном порядке.'], ['Три этапа доказательства?', 'Initialization → Maintenance → Termination.']]
    },
    {
        id: 4, unit: 'Structures', en: 'Arrays, Linked Lists, Heaps', ru: 'Коллекции и амортизированный анализ', minutes: 11, level: 'Сложности',
        lead: 'От структуры хранения зависит скорость access, insert, traverse. В экзамене часто проверяют не только Big-O, но и причину, почему одна структура быстрее другой.',
        terms: [['Array / ArrayList', 'Массив', 'Contiguous slots or references, O(1) random access.'], ['LinkedList', 'Связный список', 'Nodes connected by pointers, index access O(n).'], ['Amortized cost', 'Амортизированная стоимость', 'Cost averaged across a sequence, not a probabilistic average.'], ['Binary heap', 'Двоичная куча', 'Complete binary tree satisfying parent-child heap order.']],
        sections: [
            { title: 'ArrayList vs LinkedList', body: 'ArrayList даёт доступ по индексу за O(1) и лучшую cache locality. LinkedList идёт по ссылкам от узла к узлу, index access O(n), traverse часто медленнее из-за pointer chasing. Удаление известного узла может быть O(1), но поиск позиции O(n).' },
            { title: 'Почему dynamic array append amortized O(1)', body: 'При переполнении capacity удваивается: 1, 2, 4, 8. Редкий resize копирует n элементов за O(n), но суммарно за N вставок количество копирований составляет O(N). Поэтому amortized O(1), а worst-case отдельной вставки O(n).' },
            { title: 'Stack, Queue, Deque', body: 'Stack использует LIFO: push/pop/peek. Queue использует FIFO: offer/poll/peek. Deque позволяет добавлять и удалять с обоих концов. В Java часто используют ArrayDeque. Circular array переходит к следующей позиции через (i+1) mod capacity.' },
            { title: 'Binary Heap и PriorityQueue', body: 'Min-heap имеет минимальное значение в root, но не полностью отсортирован. peek O(1), insert/extract O(log n). Построение bottom-up heapify O(n), а последовательное извлечение всех n элементов Θ(n log n). Java PriorityQueue по умолчанию min-heap.' }
        ],
        snippet: '// Heap index math (0-based)\nint left = 2*i + 1;\nint right = 2*i + 2;\nint parent = (i - 1)/2;\n\nPriorityQueue<Integer> pq = new PriorityQueue<>();\npq.offer(8); pq.offer(2);\npq.peek(); // 2, не удаляет\npq.poll(); // 2, удаляет',
        formula: 'Append: O(1) amortized; resize: O(n) • Heap peek: O(1), poll: O(log n), build: O(n)',
        pitfalls: ['Delete all n heap elements Θ(n log n), а НЕ Θ(n).', 'LinkedList index access O(n), даже если вставка после найденного узла O(1).', 'Heap не является сортированным массивом.'],
        quick: [['Почему ArrayList traverse быстрее?', 'Локальность памяти; LinkedList — pointer chasing.'], ['Удалить n элементов из heap?', 'Θ(n log n).'], ['Bottom-up heapify?', 'Θ(n).'], ['ArrayList append amortized?', 'O(1), но отдельный resize O(n).']]
    },
    {
        id: 5, unit: 'Structures', en: 'Hashing, Trees & Tries', ru: 'Хэш-таблицы, BST, Trie и AVL', minutes: 12, level: 'Сложности',
        lead: 'HashTable ускоряет поиск по ключу, сбалансированные деревья сохраняют порядок, Trie хранит общие префиксы строк.',
        terms: [['Hash function', 'Хэш-функция', 'Maps a key to a bucket index.'], ['Load factor α', 'Коэффициент загрузки', 'Number of stored keys / number of buckets.'], ['Separate chaining', 'Цепочки', 'Store colliding entries in a per-bucket container.'], ['Trie', 'Префиксное дерево', 'Paths encode the characters of keys.']],
        sections: [
            { title: 'Хэши, коллизии и загрузка', body: 'Разные ключи могут попасть в один bucket, это collision. Chaining хранит несколько ключей в bucket. При хорошей функции expected lookup O(1+α), где α=items/buckets. Если α слишком высок, hash table увеличивает capacity и делает rehash.' },
            { title: 'Open addressing', body: 'Ключи живут непосредственно в массиве. При collision ищем другую ячейку: linear probing (+1), quadratic probing (+1², +2²...), double hashing (шаг задаёт вторая hash function). При удалении часто используют tombstone, чтобы не разорвать цепочку поиска. Linear probing может давать clustering.' },
            { title: 'BST, Red-Black и AVL', body: 'BST: все ключи слева меньше, справа больше. In-order traversal даёт отсортированный порядок. Если дерево перекосилось, высота O(n). Red-Black и AVL балансируют дерево, сохраняя операции O(log n). AVL balance factor ∈ {−1,0,+1}, типы исправлений: LL, RR, LR, RL. Red-Black: root black, NIL black, no red-red и одинаковая black-height.' },
            { title: 'Trie и строки', body: 'В Trie каждый переход соответствует одному символу. Слова cat, car, cart разделяют prefix ca. Флаг terminal отличает законченное слово от просто prefix. Если длина ключа L и переход O(1), поиск/вставка/удаление O(L), не O(n) по количеству слов.' }
        ],
        snippet: '// Load factor\ndouble alpha = (double) items / buckets;\nif (alpha > 0.75) {\n    // allocate larger table and REHASH entries\n}\n// Trie: next[node][character] → next node',
        formula: 'α = n / m • chaining lookup expected O(1+α) • Trie search O(L)',
        pitfalls: ['Collision не означает ошибку: надо её обработать.', 'Rehash означает перерасчёт bucket indices, не простое копирование по старым индексам.', 'Trie O(L) при O(1) переходе, где L — длина ключа.'],
        quick: [['Почему hash lookup O(1+α)?', 'Одна bucket lookup и ожидаемая длина цепочки α.'], ['Что при высоком α?', 'Resize + rehash.'], ['Trie search?', 'O(L) при O(1) переходе.'], ['AVL balance factor?', '−1, 0 или 1.']]
    },
